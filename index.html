<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#78c7a5">
<title>FoodWell</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>FoodWell</h1>
    <p>บันทึกอาหาร น้ำ และการเคลื่อนไหว</p>
  </div>
  <button id="resetBtn" class="ghost">ล้างข้อมูล</button>
</header>

<nav class="tabs">
  <button class="tab active" data-page="food">🍱 อาหาร</button>
  <button class="tab" data-page="water">💧 น้ำ</button>
  <button class="tab" data-page="exercise">🏃 การเคลื่อนไหว</button>
</nav>

<main>
<section id="food" class="page active">
  <div class="card">
    <h2>เพิ่มอาหาร</h2>
    <div class="grid">
      <label>ชื่ออาหาร<input id="foodName" placeholder="เช่น ข้าวกะเพราไก่"></label>
      <label>มื้อ<select id="meal">
        <option>เช้า</option><option>กลางวัน</option><option>เย็น</option><option>ของว่าง</option>
      </select></label>
      <label>พลังงานโดยประมาณ (kcal)<input id="kcal" type="number" min="0" inputmode="numeric"></label>
      <label>โปรตีน (g)<input id="protein" type="number" min="0" step="0.1"></label>
      <label>คาร์บ (g)<input id="carbs" type="number" min="0" step="0.1"></label>
      <label>ไขมัน (g)<input id="fat" type="number" min="0" step="0.1"></label>
      <label>โซเดียม (mg)<input id="sodium" type="number" min="0"></label>
      <label>ใยอาหาร (g)<input id="fiber" type="number" min="0" step="0.1"></label>
      <label>น้ำตาล (g)<input id="sugar" type="number" min="0" step="0.1"></label>
    </div>
    <label>หมายเหตุ<textarea id="note" placeholder="เช่น กินที่โรงเรียน / สูตรที่ชอบ"></textarea></label>
    <label class="upload">📷 รูปอาหาร <input id="photo" type="file" accept="image/*"></label>
    <button id="addFood" class="primary">บันทึกอาหาร</button>
    <small>ค่าพลังงานและโภชนาการเป็นค่าประมาณ ใช้เพื่อบันทึกและเรียนรู้ ไม่ใช่เป้าหมายจำกัดการกิน</small>
  </div>
  <div class="card">
    <h2>รายการวันนี้</h2>
    <div id="foodList" class="list"></div>
  </div>
</section>

<section id="water" class="page">
  <div class="card">
    <h2>💧 น้ำที่ดื่มวันนี้</h2>
    <div class="waterCount"><span id="waterTotal">0</span> ml</div>
    <div class="quick">
      <button data-water="250">+250 ml</button><button data-water="350">+350 ml</button><button data-water="500">+500 ml</button>
    </div>
    <button id="waterReset" class="ghost">เริ่มบันทึกวันใหม่</button>
    <p>ดื่มตามความกระหายและสภาพอากาศ/กิจกรรมของตัวเองได้เลย</p>
  </div>
</section>

<section id="exercise" class="page">
  <div class="card">
    <h2>🏃 การเคลื่อนไหว</h2>
    <div class="grid">
      <label>กิจกรรม<input id="exName" placeholder="เช่น เดิน เล่นกีฬา ยืดเหยียด"></label>
      <label>เวลา (นาที)<input id="exMin" type="number" min="0"></label>
    </div>
    <button id="addEx" class="primary">บันทึกกิจกรรม</button>
  </div>
  <div class="card">
    <h2>กิจกรรมวันนี้</h2>
    <div id="exList" class="list"></div>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
