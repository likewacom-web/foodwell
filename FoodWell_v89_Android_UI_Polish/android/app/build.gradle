plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// Firebase (Gmail sign-in + multi-device sync) is enabled once app/google-services.json is added;
// without it the app still builds and the sync card explains how to set it up.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android { namespace 'com.foodwell.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.foodwell.app'; minSdk 26; targetSdk 35
        // Release builds pass -PversionCode (the CI run number) so every upload to Play is higher.
        versionCode((project.findProperty('versionCode') ?: '89').toString().toInteger())
        versionName((project.findProperty('versionName') ?: '1.0.' + versionCode).toString())
        // Ads are off unless built with -Pads=true. The IDs default to Google's test IDs;
        // pass -PadmobAppId=... -PadmobBannerId=... for the real ones (see MONETIZATION.md).
        def ads = (project.findProperty('ads') ?: 'false').toString().toBoolean()
        manifestPlaceholders = [admobAppId: project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'boolean', 'ADS_ENABLED', ads.toString()
        buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${project.findProperty('admobBannerId') ?: 'ca-app-pub-3940256099942544/9214589741'}\""
        buildConfigField 'String', 'ADMOB_REWARDED_ID', "\"${project.findProperty('admobRewardedId') ?: 'ca-app-pub-3940256099942544/5224354917'}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // A fixed debug key checked into the repo: every CI build gets the same signature, so a new
    // APK installs over the previous one instead of failing with "package conflicts".
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        // The upload key for Google Play never lives in the repo: CI writes it from a GitHub secret and
        // passes the path and passwords as environment variables (see PLAY_STORE.md).
        if (System.getenv('FW_KEYSTORE')) {
            release {
                storeFile file(System.getenv('FW_KEYSTORE'))
                storePassword System.getenv('FW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FW_KEY_ALIAS')
                keyPassword System.getenv('FW_KEY_PASSWORD') ?: System.getenv('FW_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // No code shrinking: the page talks to Kotlin through @JavascriptInterface methods.
            minifyEnabled false
            if (System.getenv('FW_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
}
