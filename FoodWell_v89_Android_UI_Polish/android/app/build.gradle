plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// Firebase (Gmail sign-in + multi-device sync) is enabled once app/google-services.json is added;
// without it the app still builds and the sync card explains how to set it up.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android { namespace 'com.foodwell.app'; compileSdk 35
    defaultConfig { applicationId 'com.foodwell.app'; minSdk 26; targetSdk 35; versionCode 89; versionName '89.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // A fixed debug key checked into the repo: every CI build gets the same signature, so a new
    // APK installs over the previous one instead of failing with "package conflicts".
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha12'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
}
