<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodWell — เข้าร่วมชาเลนจ์</title>
<style>
 :root{--bg:#fff0f5;--card:#fff;--text:#22242a;--muted:#62666f;--accent:#c2477a}
 @media (prefers-color-scheme:dark){:root{--bg:#17151a;--card:#221f26;--text:#eceef2;--muted:#a3a7b0;--accent:#f0a3c1}}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
 main{width:100%;max-width:420px;margin:16px;padding:28px 20px;border-radius:24px;background:var(--card);text-align:center;box-shadow:0 10px 30px #0001}
 .big{font-size:56px}.code{font-size:34px;font-weight:900;letter-spacing:.25em;margin:8px 0 18px;color:var(--accent)}
 a.btn{display:block;padding:14px;border-radius:14px;background:linear-gradient(135deg,#f7bfd0,#e887aa);color:#2b1820;font-weight:800;text-decoration:none}
 p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
 <div class="big">🏅</div>
 <h1 style="margin:4px 0;font-size:22px">เพื่อนชวนคุณแข่งชาเลนจ์<br><small style="font-weight:600;font-size:15px;color:var(--muted)">Your friend invited you to a challenge</small></h1>
 <div class="code" id="code">——</div>
 <a class="btn" id="open" href="#">เปิดในแอป FoodWell · Open in FoodWell</a>
 <p>ถ้าแอปไม่เปิด: ติดตั้ง FoodWell แล้วไปที่ <b>เพิ่มเติม → ชาเลนจ์ → เพื่อน</b> และใส่รหัสด้านบน<br>
 If the app doesn't open: install FoodWell, go to <b>More → Challenges → Friends</b> and enter the code above.</p>
</main>
<script>
 const c=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
 document.getElementById('code').textContent=c||'——';
 const deep='foodwell://join?c='+c;
 const a=document.getElementById('open');
 a.href=/android/i.test(navigator.userAgent)?'intent://join?c='+c+'#Intent;scheme=foodwell;package=com.foodwell.app;end':deep;
 if(c&&/android/i.test(navigator.userAgent))setTimeout(()=>{location.href=a.href},300);
</script>
</body>
</html>
