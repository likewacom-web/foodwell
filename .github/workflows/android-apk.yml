name: Build FoodWell APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FoodWell_v89_Android_UI_Polish/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodWell_v89_Android_UI_Polish/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with the Android SDK preinstalled (ANDROID_HOME);
      # android-actions/setup-android@v3 fails trying to install the removed 'tools' package.
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodWell-debug-apk
          path: FoodWell_v89_Android_UI_Polish/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A plain .apk download link (no zip, no GitHub login):
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/FoodWell.apk
      - name: Publish APK to the 'latest-debug' release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp FoodWell_v89_Android_UI_Polish/android/app/build/outputs/apk/debug/app-debug.apk FoodWell.apk
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug FoodWell.apk --clobber
            gh release edit latest-debug --notes "FoodWell debug APK · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            gh release create latest-debug FoodWell.apk --prerelease --target "$GITHUB_SHA" \
              --title "FoodWell (debug ล่าสุด)" --notes "FoodWell debug APK · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          fi
