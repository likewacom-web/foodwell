name: FoodWell launch test (emulator)

on:
  workflow_dispatch:
  push:
    paths:
      - 'FoodWell_v89_Android_UI_Polish/android/**'
      - '.github/workflows/android-smoke-test.yml'

jobs:
  launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    defaults:
      run:
        working-directory: FoodWell_v89_Android_UI_Polish/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: FoodWell_v89_Android_UI_Polish/android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.foodwell.app/.MainActivity
            sleep 15
            adb logcat -d > logcat.txt || true
            echo "===== Crash log (AndroidRuntime) ====="
            grep -A 40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -120 || true
            echo "===== FoodWell process ====="
            adb shell pidof com.foodwell.app || (echo "::error::FoodWell is not running after launch (crashed)" && exit 1)

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: FoodWell_v89_Android_UI_Polish/android/logcat.txt
          if-no-files-found: ignore
