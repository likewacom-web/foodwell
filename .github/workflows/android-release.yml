name: Release FoodWell (Google Play)

# Run by hand from the Actions tab: builds a signed Android App Bundle (.aab) to upload to Play Console.
# Needs these repository secrets (Settings → Secrets and variables → Actions), see PLAY_STORE.md:
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, (optional) UPLOAD_KEY_PASSWORD
#   for ads:  ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_REWARDED_ID
on:
  workflow_dispatch:
    inputs:
      ads:
        description: 'Show ads (needs the ADMOB_* secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodWell_v89_Android_UI_Polish/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is missing — see PLAY_STORE.md (step 2)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FW_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          FW_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          FW_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FW_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADS: ${{ inputs.ads }}
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          ARGS="-PversionCode=$VC -PversionName=1.0.$VC"
          if [ "$ADS" = "true" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_ID" ]; then echo "::error::ads=true needs ADMOB_APP_ID and ADMOB_BANNER_ID secrets"; exit 1; fi
            ARGS="$ARGS -Pads=true -PadmobAppId=$ADMOB_APP_ID -PadmobBannerId=$ADMOB_BANNER_ID"
            [ -n "$ADMOB_REWARDED_ID" ] && ARGS="$ARGS -PadmobRewardedId=$ADMOB_REWARDED_ID"
          fi
          gradle --no-daemon bundleRelease $ARGS
          echo "Built versionCode $VC"

      - name: Upload .aab
        uses: actions/upload-artifact@v4
        with:
          name: FoodWell-release-aab
          path: FoodWell_v89_Android_UI_Polish/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
